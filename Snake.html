<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Layout.css">
    <title>Happy 4th Anniversary</title>
    <style>
        /* Snake-page-specific styles, kept separate so they don't collide with Layout.css */
        .Snake {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #2b0a1f, #5c1a3a, #2b0a1f);
            font-family: 'Times New Roman', Times, serif;
            color: #f2d9e0;
            text-align: center;
            padding: 20px;
            overflow: hidden;
        }

        .Snake main h2 {
            font-weight: normal;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 0 auto;
            font-size: 2.5rem;
            color: #ac6363;
            text-shadow: 0 0 20px rgba(244, 194, 194, 0.5);
            margin-bottom: 20px;
            text-align: center;
            position: fixed;
            left: 50%;
            top: 30px;
            transform: translateX(-50%);
        }

        .Snake .navbar ul {
            max-width: 100%;
            margin: 0px;
            padding: 0px;
            text-shadow: 0 0 20px rgba(244, 194, 194, 0.5);
            overflow: hidden;
            gap: 5px;
            font-size: 2rem;
            list-style-type: none;
            background-color: #200509;
            display: flex;
            justify-content: center;
            position: relative;
            top: 0;
        }

        .Snake .navbar a {
            color: #d69cb0;
            text-decoration: none;
            padding: 15px;
            display: block;
            text-align: center;
            transition: all 0.3s ease;
        }

        .Snake .navbar a:hover {
            color: #25060b;
            background-color: #e997a6;
            text-shadow: 0px 0px 40px rgba(141, 29, 29, 0.959);
            letter-spacing: 6px;
        }

        .Snake button.return-btn {
            background: none;
            border: none;
            color: #f2d9e0;
            font-family: 'Times New Roman', Times, serif;
            font-size: 1.0rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            cursor: pointer;
            padding: 10px 30px;
            transition: all 0.3s ease;
            position: fixed;
            left: 5px;
            top: 25px;
        }

        .Snake button.return-btn:hover {
            color: #ffffff;
            text-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
            letter-spacing: 6px;
        }

        .game-wrap {
            margin-top: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .scoreboard {
            font-size: 1.4rem;
            letter-spacing: 2px;
            color: #eb82a7;
            text-shadow: 0 0 10px rgba(235, 130, 167, 0.6);
        }

        canvas {
            background-color: #180208;
            border: 3px solid #eb82a7;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
        }

        .hint {
            font-size: 0.9rem;
            letter-spacing: 1px;
            color: #d69cb0;
            margin-top: 5px;
        }

        /* Win modal */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(20, 3, 12, 0.85);
            align-items: center;
            justify-content: center;
            z-index: 10;
            animation: fadeIn 0.6s ease forwards;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal-box {
            max-width: 550px;
            margin: 20px;
            background-color: #eb82a7;
            border-radius: 14px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
            padding: 35px 30px;
            color: #5e1d47;
        }

        .modal-box h1 {
            font-size: 2rem;
            margin-bottom: 15px;
            color: #250c0c;
            text-shadow: 0 0 15px rgb(250, 99, 99);
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .modal-box p {
            font-size: 1.05rem;
            line-height: 1.8;
            letter-spacing: 0.05em;
            text-shadow: 0 0 5px rgba(95, 49, 91, 0.5);
        }

        .modal-box button {
            margin-top: 20px;
            margin-left: 10px;
            background: none;
            border: 2px solid #5e1d47;
            color: #5e1d47;
            font-family: 'Times New Roman', Times, serif;
            font-size: 1rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            cursor: pointer;
            padding: 8px 24px;
            border-radius: 6px;
            transition: all 0.3s ease;
        }

        .modal-box button:hover {
            background-color: #5e1d47;
            color: #f2d9e0;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body class="Snake">

    <header>
        <title>Happy 4th Anniversary</title>
    </header>

    <main>
        <h2>Happy 4th Anniversary</h2>
    </main>

    <nav class="navbar">
        <ul>
            <li><a href="Main.html">Home</a></li>
            <li><a href="Poem.html">Letter</a></li>
            <li><a href="Snake.html">Snake</a></li>
        </ul>
    </nav>

    <div class="game-wrap">
        <div class="scoreboard">Score: <span id="score">0</span> / 100</div>
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="hint">Use arrow keys or WASD to move. Reach 100 points for a surprise.</div>
    </div>

    <button class="return-btn" id="returnBtn">Return</button>

    <!-- Background music: replace the src below with your track's filename -->
    <audio id = "bgMusic"autoplay loop>
        <source src="Enemy Approaching.mp3" type="audio/mpeg">
    </audio>

    <!-- Sound effects: replace the src below with your own sound files -->
    <audio id="eatSound">
        <source src="Minecraft Eating - Sound Effect (HD).mp3" type="audio/mpeg">
    </audio>
    <audio id="winSound">
        <source src="Persona 5 OST 19 - Victory.mp3" type="audio/mpeg">
    </audio>

    <div class="modal-overlay" id="winModal">
        <div class="modal-box">
            <h1>You made it, luv</h1>
            <p id="winMessage"></p>
            <button id="closeModal">Close</button>
            <button id="playAgainBtn">Play Again</button>
        </div>
    </div>

    <script>
        document.getElementById('returnBtn').addEventListener('click', function () {
            window.location.href = "index.html";
        });

        // ---------- Snake game ----------
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let velocity = { x: 0, y: 0 };
        let food = randomFoodPosition();
        let score = 0;
        let pointsPerFood = 10;
        let gameOver = false;
        let hasWon = false;

        const scoreEl = document.getElementById('score');
        const winModal = document.getElementById('winModal');
        const winMessage = document.getElementById('winMessage');
        const bgMusic = document.getElementById('bgMusic');
        const eatSound = document.getElementById('eatSound');
        const winSound = document.getElementById('winSound');

        const winText = "Well, congrats luv. Another surprise, I will come to your debut. I will find a way, Dad and Mom is already preparing and planning my ticket and flight. So hehe congrats luv (dont tell your mom, i was supposed to keep this as a secret plss)";

        function randomFoodPosition() {
            return {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
        }

        function drawCell(x, y, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x * gridSize, y * gridSize, gridSize - 2, gridSize - 2);
        }

        function update() {
            if (gameOver || hasWon) return;
            if (velocity.x === 0 && velocity.y === 0) return; // game hasn't started yet

            const head = { x: snake[0].x + velocity.x, y: snake[0].y + velocity.y };

            // Wall collision
            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                gameOver = true;
                return;
            }

            // Self collision
            if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
                gameOver = true;
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += pointsPerFood;
                scoreEl.textContent = score;
                food = randomFoodPosition();

                eatSound.currentTime = 0;
                eatSound.play();

                if (score >= 100 && !hasWon) {
                    hasWon = true;
                    winSound.currentTime = 0;
                    winSound.play();
                    triggerWin();
                }
            } else {
                snake.pop();
            }
        }

        function draw() {
            ctx.fillStyle = '#180208';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawCell(food.x, food.y, '#ff6b81');

            snake.forEach((seg, i) => {
                drawCell(seg.x, seg.y, i === 0 ? '#f2d9e0' : '#eb82a7');
            });

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f2d9e0';
                ctx.font = '20px "Times New Roman"';
                ctx.textAlign = 'center';
                ctx.fillText('Game Over', canvas.width / 2, canvas.height / 2 - 10);
                ctx.font = '14px "Times New Roman"';
                ctx.fillText('Press Space to restart', canvas.width / 2, canvas.height / 2 + 15);
            }
        }

        function triggerWin() {
            winMessage.textContent = winText;
            winModal.classList.add('show');
            bgMusic.pause();
        }

        document.getElementById('closeModal').addEventListener('click', () => {
            winModal.classList.remove('show');
        });

        document.getElementById('playAgainBtn').addEventListener('click', () => {
            resetGame();
        });

        function resetGame() {
            snake = [{ x: 10, y: 10 }];
            velocity = { x: 0, y: 0 };
            food = randomFoodPosition();
            score = 0;
            scoreEl.textContent = score;
            gameOver = false;
            hasWon = false;
            winModal.classList.remove('show');
            winSound.pause();
            bgMusic.play(); 
        }

        document.addEventListener('keydown', (e) => {
            switch (e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    if (velocity.y !== 1) velocity = { x: 0, y: -1 };
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    if (velocity.y !== -1) velocity = { x: 0, y: 1 };
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    if (velocity.x !== 1) velocity = { x: -1, y: 0 };
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    if (velocity.x !== -1) velocity = { x: 1, y: 0 };
                    break;
                case ' ':
                    if (gameOver) resetGame();
                    break;
            }
        });

        function gameLoop() {
            update();
            draw();
        }

        setInterval(gameLoop, 120);
    </script>

</body>
</html>
